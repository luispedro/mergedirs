[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mergedirs"
description = "Merge directories without losing files"
readme = "README.md"
authors = [
    {name = "Luis Pedro Coelho", email = "luis@luispedro.org"},
]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://luispedro.org/software/merge/"

[project.scripts]
mergedirs = "mergedirs.merge:main"
hashdirs = "mergedirs.merge:main_hashdirs"

[tool.setuptools]
packages = ["mergedirs"]

[tool.setuptools.dynamic]
version = {attr = "mergedirs.mergedirs_version.__version__"}
